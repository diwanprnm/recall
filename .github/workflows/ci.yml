name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    api:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: recall-api
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_DB: recall
                    POSTGRES_USER: recall
                    POSTGRES_PASSWORD: recall_dev_secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U recall"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 5
        env:
            DATABASE_URL: postgresql://recall:recall_dev_secret@localhost:5432/recall
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: pip
                  cache-dependency-path: recall-api/pyproject.toml
            - run: pip install -e ".[dev]"
            - run: ruff check .
            - run: pytest

    web:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: recall-web
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: recall-web/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build
              env:
                  NEXT_PUBLIC_API_URL: http://localhost:8000

    deploy:
        runs-on: ubuntu-latest
        needs: [api, web]
        # hanya push ke main yang deploy; PR cuma jalankan CI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - name: Deploy to VPS via SSH
              env:
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  VPS_HOST: ${{ secrets.VPS_HOST }}
                  VPS_USER: ${{ secrets.VPS_USER }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/key
                  chmod 600 ~/.ssh/key
                  ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
                  ssh -i ~/.ssh/key "$VPS_USER@$VPS_HOST" '
                    set -e
                    cd ~/recall
                    git pull --ff-only
                    git submodule update --init --recursive
                    docker compose -f docker-compose.prod.yml up -d --build
                    docker image prune -f
                  '
