# Recall App — nginx reverse proxy
# Taruh di /etc/nginx/sites-available/recall, lalu:
#   ln -sf /etc/nginx/sites-available/recall /etc/nginx/sites-enabled/recall
#   nginx -t && systemctl reload nginx
#
# Ganti APP_DOMAIN dan API_DOMAIN dengan domain sebenarnya.

# ── Web (Next.js) ──
server {
    server_name APP_DOMAIN;        # contoh: recall.example.com
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── API (Hono) — port 8001 karena 8000 dipakai caption_api ──
server {
    server_name API_DOMAIN;        # contoh: api.recall.example.com
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
