# ─── Recall — Production (VPS) ─────────────────────────────────────────────
# Deploy: docker compose -f docker-compose.prod.yml up -d --build
# Butuh .env di root repo (isi POSTGRES_PASSWORD, NEXT_PUBLIC_API_URL)
# dan recall-api/.env + recall-web/.env.local di VPS.
# nginx (di luar docker) proxy ke 127.0.0.1:3001 (web) dan :8000 (api).
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    # tanpa ports — tidak expose DB ke internet.
    # akses manual: docker compose -f docker-compose.prod.yml exec postgres psql -U recall
    environment:
      POSTGRES_DB: recall
      POSTGRES_USER: recall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # migrations auto-load HANYA saat volume kosong (first run).
      # ponytail: migration baru harus dijalankan manual (psql -f). Ganti ke Alembic saat rilis makin sering.
      - ./recall-api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recall"]
      interval: 5s
      timeout: 3s
      retries: 5

  recall-api:
    build: ./recall-api
    restart: unless-stopped
    # hanya localhost — nginx proxy dari luar, tidak expose ke internet
    # port 8001 karena 8000 dipakai caption_api
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - ./recall-api/.env
    environment:
      DATABASE_URL: postgresql://recall:${POSTGRES_PASSWORD}@postgres:5432/recall
      ENVIRONMENT: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
    # tanpa --reload / volume mount — image sudah final (CMD di Dockerfile)

  recall-web:
    ports:
      - "127.0.0.1:3001:3001"
    build:
      context: ./recall-web
      args:
        # URL API yang dicapai browser/rewrite. Isi di .env root VPS.
        # Contoh: https://api.domainkamu.com
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file:
      - ./recall-web/.env.local
    environment:
      NODE_ENV: production
    depends_on:
      - recall-api

volumes:
  pg_data:

